# Stages the packages on npm with trusted publishing (OIDC): no npm token, no 2FA prompt.
# `npm run release:*` bumps versions, writes the changelog, tags and pushes locally,
# then this workflow stages the tagged version. Nothing is public until a maintainer
# approves the staged versions with 2FA (npmjs.com → Staged Packages, or `npm stage approve`).
#
# Each package needs a trusted publisher on npmjs.com:
# Settings → Trusted publishing → GitHub Actions → lsst25 / pik / publish.yml
name: Publish

on:
  push:
    tags:
      - 'v*'
  # Retry a failed run; versions that are already published or staged are skipped.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Staged publishing needs npm 11.15.0 or later.
      - run: npm --version

      - run: npm ci

      - run: npx nx run-many -t build

      # `npm stage` is not workspace-aware, so stage each package from its own directory.
      - name: Stage packages
        run: |
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skip $name@$version: already published"
              continue
            fi

            echo "Stage $name@$version"
            if ! output=$(cd "$dir" && npm stage publish 2>&1); then
              echo "$output"
              # A staged version is not visible to `npm view`; npm answers E409
              # ("Cannot stage previously published/staged version").
              if grep -q 'E409' <<<"$output"; then
                echo "Skip $name@$version: already staged"
                continue
              fi
              exit 1
            fi
            echo "$output"
          done

      - name: Summary
        run: |
          {
            echo "### Staged on npm"
            echo
            echo "Approve the staged versions with 2FA:"
            echo "npmjs.com → Staged Packages, or \`npm stage list\` and \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
